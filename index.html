<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mörkrets Hjärta</title>
<style>
  :root {
    --bg: #0c0a0e; --panel: #16121a; --line: #2c2330; --text: #e6dfe8; --muted: #9a8fa0;
    --accent: #c0283a; --gold: #e8c33a; --good: #6fd08c; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  #wrap { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  #stage { flex: 1 1 auto; min-width: 0; }
  canvas { width: 100%; max-width: 960px; height: auto; display: block; border: 1px solid var(--line); border-radius: 6px;
           cursor: crosshair; background: #000; }
  #side { width: 300px; flex: 0 0 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
          max-height: calc(100vh - 24px); overflow-y: auto; }
  h1 { font-size: 18px; margin: 0 0 6px; color: var(--accent); letter-spacing: .5px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 12px 0 4px; }
  #stats div { display: flex; justify-content: space-between; }
  #stats b { font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: #2a1a20; border-radius: 3px; overflow: hidden; margin: 2px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  #tools { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  button { background: #221b27; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px;
           font: inherit; cursor: pointer; text-align: left; }
  button:hover:not(:disabled) { border-color: #5a4660; }
  button.on { border-color: var(--accent); background: #3a1820; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button small { color: var(--muted); display: block; font-size: 11px; }
  #speed { display: flex; gap: 4px; margin-top: 6px; }
  #speed button { flex: 1; text-align: center; }
  #info { min-height: 48px; color: var(--muted); }
  #info b { color: var(--text); }
  #crlist div { display: flex; justify-content: space-between; padding: 1px 0; }
  #log div { padding: 2px 0; border-bottom: 1px solid #1f1924; }
  #log .good { color: var(--good); } #log .bad { color: var(--bad); } #log .gold { color: var(--gold); }
  .help { color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) { #wrap { flex-direction: column; } #side { width: 100%; flex-basis: auto; max-height: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="960" height="600"></canvas>
    <p class="help">Vänster-dra: markera jord för grävning / bygg rum &nbsp;·&nbsp; Vänsterklick på varelse: plocka upp &nbsp;·&nbsp;
      Högerklick: släpp / örfila &nbsp;·&nbsp; Mellanslag: paus &nbsp;·&nbsp; 1–3: hastighet</p>
  </div>
  <aside id="side">
    <h1>Mörkrets Hjärta</h1>
    <div id="stats"></div>
    <h2>Verktyg</h2>
    <div id="tools"></div>
    <div id="speed">
      <button data-speed="0">⏸</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="3">3×</button>
    </div>
    <h2>Info</h2>
    <div id="info">Håll musen över en varelse.</div>
    <h2>Varelser</h2>
    <div id="crlist"></div>
    <h2>Händelser</h2>
    <div id="log"></div>
  </aside>
</div>
<script src="game.js"></script>
</body>
</html>
